<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe0" />
    <title>菜谱蓝图 · 程序员做饭指南</title>
    <meta name="description" content="300 多道家常菜，画成一张张蓝图：原料连到步骤，跟着做不漏料。支持蓝图、图文和烹饪模式。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 链接预览。部署后由 worker/index.js 改写为绝对地址，并为 /r/<菜谱> 换成该菜谱的标题、简介和成品图 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="菜谱蓝图" />
    <meta property="og:title" content="菜谱蓝图 · 程序员做饭指南" />
    <meta property="og:description" content="300 多道家常菜，画成一张张蓝图：原料连到步骤，跟着做不漏料。支持蓝图、图文和烹饪模式。" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- QQ / QQ 空间读取 schema.org 的 itemprop -->
    <meta itemprop="name" content="菜谱蓝图 · 程序员做饭指南" />
    <meta itemprop="description" content="300 多道家常菜，画成一张张蓝图：原料连到步骤，跟着做不漏料。支持蓝图、图文和烹饪模式。" />
    <meta itemprop="image" content="/og.png" />
    <script>
      // 首屏前确定主题（默认“典藏”），避免闪烁；之后由 src/useTheme.ts 接管
      ;(function () {
        var p = null
        try { p = localStorage.getItem('theme') } catch (e) {}
        var t = p === 'light' || p === 'dark' || p === 'paper' ? p : 'paper'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').setAttribute('content', { light: '#ffffff', dark: '#1e1e1e', paper: '#f6efe0' }[t])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
