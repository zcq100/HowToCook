<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小程序界面预览</title>
<style id="native-style">
</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6d9be;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#2a221a}.preview-note{text-align:center;font-size:12px;padding:12px;color:#76644f}.phone{max-width:390px;margin:0 auto 32px;box-shadow:0 8px 32px #2a221a18;min-height:800px}.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fbf6eb;position:sticky;top:0;z-index:20;border-bottom:1px solid #ddd0b4}.nav button{border:0;background:none;color:#7a2e26;font-size:24px;cursor:pointer;margin:0;width:44px}.nav-title{font-size:16px;font-weight:500;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.capsule{border:1px solid #ddd0b4;border-radius:20px;padding:1px 12px;font-size:18px;flex-shrink:0}view,scroll-view{display:block}text{display:inline}block{display:contents}input{font:inherit;outline:none;background:transparent;border:0;width:0}button{font:inherit;cursor:pointer;border:0;display:block}button:focus-visible,[role=button]:focus-visible{outline:2px solid #7a2e26;outline-offset:2px}.categories{overflow:visible}.category,.recipe-card,.recipe-tab{cursor:pointer}.recipe-tabs,.library-tools{top:56px}.cook-actions,.cook-nav{width:100%;max-width:390px;right:auto!important;left:50%!important;transform:translateX(-50%)}.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:8px;background:#2a221a;color:#fffaf0;font-size:14px;max-width:350px;text-align:center;z-index:30}@media(max-width:480px){body{background:#fbf6eb}.preview-note{font-size:11px;padding:8px}.phone{margin:0;max-width:100%;box-shadow:none}.cook-actions,.cook-nav{max-width:100%}}
body[data-page="blueprint"] .phone{height:calc(100dvh - 32px);min-height:0;display:flex;flex-direction:column}body[data-page="blueprint"] #app{flex:1;min-height:0}body[data-page="blueprint"] .nav{flex-shrink:0}
</style>
<div class="preview-note">浏览器界面预览 · 使用原生页面模板与菜谱数据 · 微信分享需真机验证</div>
<main class="phone"><header class="nav"><button id="back" aria-label="返回">‹</button><span class="nav-title">赛博菜谱</span><span class="capsule">··· ⊙</span></header><div id="app"></div></main>
<script type="module" src="/preview/preview.js"></script>
</html>
