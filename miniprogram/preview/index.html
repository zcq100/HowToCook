<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小程序界面预览</title>
<style id="native-style"></style>
<style>
*{box-sizing:border-box}body{margin:0;background:#dedfd6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#292e26}.preview-note{text-align:center;font-size:13px;padding:16px;color:#58614b}.phone{max-width:390px;margin:0 auto 32px;background:#f7f3ea;box-shadow:0 10px 45px #29321c20;min-height:800px}.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#f7f3ea;position:sticky;top:0;z-index:2;border-bottom:1px solid #e6e4d8}.nav button{border:0;background:none;color:#364b32;font-size:20px;cursor:pointer}.nav-title{font-size:16px;font-weight:600}.capsule{border:1px solid #d6d8cc;border-radius:20px;padding:1px 12px;font-size:18px}view,scroll-view{display:block}text,block{display:contents}input{box-sizing:content-box;width:calc(100% - 50px);font:inherit;outline:none}button{font:inherit;cursor:pointer;border:0;display:block;padding:10px 20px;margin:12px auto;border-radius:8px}.categories{overflow:auto;scrollbar-width:none}.chip,.recipe-card,.footer{cursor:pointer}.share-button{width:100%}.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:8px;background:#292e26;color:white;font-size:14px;max-width:350px;text-align:center} @media(max-width:480px){body{background:#f7f3ea}.preview-note{font-size:11px;padding:8px}.phone{margin:0;max-width:100%;box-shadow:none}}
</style>
<div class="preview-note">浏览器界面预览 · 使用原生页面模板与样本数据 · 微信分享需真机验证</div>
<main class="phone"><header class="nav"><button id="back" aria-label="返回">‹</button><span class="nav-title">今天做什么</span><span class="capsule">··· ⊙</span></header><div id="app"></div></main>
<script type="module" src="/preview/preview.js"></script>
</html>
